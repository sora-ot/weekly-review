<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f5ef">
  <title>拾周 · 我的周报</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4m8-4v4M8 14h2m4 0h2m-8 3h2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-check-square" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m7 12 3 3 7-7"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></symbol>
    <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18h1a2 2 0 0 0 1.6-3.2 1.7 1.7 0 0 1 1.4-2.7h1A4 4 0 0 0 21 11a9 9 0 0 0-9-8Z"/><path d="M7 10h.01M9 6h.01M14 6h.01M17 10h.01" stroke-width="3"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m15 5 4 4M4 20l4-1L20 7a2.8 2.8 0 0 0-4-4L4 15Z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v6m4-6v6"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M20 3C8 2 3 8 5 14c2 7 15 5 15-11ZM4 21l12-12"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-4 4 4-4 4 4M4 16v4h16v-4"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 4h14a2 2 0 0 1 2 2v15H6a2 2 0 0 1-2-2V4Zm0 13h16M8 7h8m-8 4h5"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16m7-11-3 3 3 3"/></symbol>
  </defs></svg>
  <div class="app-shell">
    <button id="sidebar-scrim" class="sidebar-scrim" aria-label="关闭导航"></button>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand-row">
        <a class="brand" href="/" aria-label="拾周首页"><span class="brand-mark"><svg class="icon"><use href="#i-calendar"/></svg></span><span>拾周<span class="brand-sub">WEEKLY JOURNAL</span></span></a>
        <button id="sidebar-collapse" class="icon-button" aria-label="折叠侧栏" title="折叠侧栏" aria-controls="sidebar" aria-expanded="true"><svg class="icon"><use href="#i-sidebar"/></svg></button>
      </div>
      <nav class="main-nav" aria-label="主导航">
        <button class="nav-item active" data-view="weeks"><svg class="icon"><use href="#i-book"/></svg><span>我的周报</span><span class="nav-indicator"></span></button>
        <button class="nav-item" data-view="overview"><svg class="icon"><use href="#i-layers"/></svg><span>所有记录</span><span id="nav-record-count" class="nav-count">0</span></button>
        <button class="nav-item" data-view="todos"><svg class="icon"><use href="#i-check-square"/></svg><span>全部待办</span><span id="nav-todo-count" class="nav-count">0</span></button>
      </nav>
      <div class="sidebar-calendar">
        <div class="month-heading"><button id="month-picker-button" class="month-title" aria-label="选择月份"></button><div class="arrow-pair"><button id="previous-month" class="icon-button" aria-label="上个月"><svg class="icon"><use href="#i-left"/></svg></button><button id="next-month" class="icon-button" aria-label="下个月"><svg class="icon"><use href="#i-right"/></svg></button></div></div>
        <input id="month-picker" type="month" class="month-picker" aria-label="月份" hidden>
        <div class="calendar-labels" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
        <div id="calendar-grid" class="calendar-grid" role="group" aria-label="月历"></div>
        <button id="calendar-today" class="calendar-today"><span class="small-dot"></span>回到本周<svg class="icon"><use href="#i-right"/></svg></button>
      </div>
      <div class="sidebar-year"><div><span id="year-progress-label"></span><svg class="icon"><use href="#i-leaf"/></svg></div><div class="year-progress-track"><span id="year-progress"></span></div><span id="year-progress-count" class="year-count"></span></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="topbar-title"><button id="sidebar-toggle" class="icon-button sidebar-toggle" aria-label="展开侧栏" title="展开侧栏" aria-controls="sidebar" aria-expanded="false"><svg class="icon"><use href="#i-menu"/></svg></button><h1 id="page-title">我的周报</h1><span class="topbar-separator"></span><span id="today-label" class="today-label"></span></div><div class="topbar-actions"><button id="export-button" class="quiet-button" aria-label="????" title="????"><svg class="icon"><use href="#i-download"/></svg><span>导出周报</span></button><button id="settings-button" class="icon-button appearance-button" aria-label="外观设置" title="外观设置"><svg class="icon"><use href="#i-palette"/></svg></button></div></header>
      <main class="page-content">
        <section class="week-hero" id="week-hero" aria-label="当前周"><div class="hero-shade"></div><div class="hero-content"><div class="hero-eyebrow"><span id="hero-week"></span><span id="current-week-badge" class="week-badge">本周</span></div><h2 id="hero-dates"></h2><div class="hero-meta"><span id="hero-record-count">0 条记录</span><span class="meta-divider"></span><span id="hero-month"></span></div></div><div class="hero-navigation"><button id="previous-week" class="hero-arrow" aria-label="上一周"><svg class="icon"><use href="#i-left"/></svg></button><button id="go-this-week" class="hero-today">本周</button><button id="next-week" class="hero-arrow" aria-label="下一周"><svg class="icon"><use href="#i-right"/></svg></button></div></section>
        <div class="content-columns" id="week-view">
          <section class="journal-panel">
            <div class="journal-toolbar"><div class="tabs" role="tablist" aria-label="周报内容"><button id="records-tab" class="tab active" role="tab" aria-selected="true">本周记录 <span id="record-tab-count" class="tab-count">0</span></button><button id="summary-tab" class="tab" role="tab" aria-selected="false">周总结</button></div><button id="add-entry" class="primary-button"><svg class="icon"><use href="#i-plus"/></svg>记一笔</button></div>
            <div id="records-panel" role="tabpanel" aria-labelledby="records-tab"><div id="week-days" class="week-days" role="group" aria-label="当周日期"></div><div class="records-controls"><button id="all-dates" class="filter-label active">整周<span id="filter-date-label"></span></button><label class="search-box"><svg class="icon"><use href="#i-search"/></svg><input id="record-search" type="search" aria-label="搜索本周记录" placeholder="搜索记录" maxlength="100"></label></div><div id="records-list" class="records-list" aria-live="polite"></div></div>
            <div id="summary-panel" class="summary-panel" role="tabpanel" aria-labelledby="summary-tab" hidden><div class="summary-heading"><svg class="icon"><use href="#i-book"/></svg><span>这一周</span><span id="summary-status" class="save-status">已保存</span></div><textarea id="week-summary" aria-label="周总结" placeholder="写下这一周…" maxlength="30000"></textarea><div class="summary-footer"><span id="summary-length">0 字</span><button id="save-summary" class="quiet-button"><svg class="icon"><use href="#i-check"/></svg>保存</button></div></div>
            <div class="journal-footer"><span id="journal-footer-label"></span><span class="footer-mark">WEEK BY WEEK <svg class="icon"><use href="#i-leaf"/></svg></span></div>
          </section>
          <aside class="todo-rail"><section class="todo-panel"><div class="todo-panel-heading"><h2>待办事项 <span id="pending-count" class="heading-count">0</span></h2><button id="add-todo" class="add-todo-button icon-button" aria-label="新增待办"><svg class="icon"><use href="#i-plus"/></svg></button></div><div class="todo-tabs"><button data-todo-filter="pending" class="active">待完成</button><button data-todo-filter="completed">已完成 <span id="completed-count">0</span></button></div><div id="todo-list" class="todo-list" aria-live="polite"></div><button id="add-todo-bottom" class="todo-add-bottom"><svg class="icon"><use href="#i-plus"/></svg>添加待办</button></section><div class="week-note"><span class="week-note-icon"><svg class="icon"><use href="#i-leaf"/></svg></span><div><span>本周足迹</span><strong id="week-footprint">0 天 · 0 条记录</strong></div><div class="footprint-dots" id="footprint-dots"></div></div></aside>
        </div>
        <section id="todos-view" class="todos-view" hidden><div class="todos-overview"><div><span class="section-eyebrow">TO-DO LIST</span><h2>每件事，慢慢完成。</h2></div><button id="add-todo-wide" class="primary-button"><svg class="icon"><use href="#i-plus"/></svg>新增待办</button></div><div id="todo-stats" class="todo-stats"></div><div class="wide-todo-toolbar"><div class="tabs"><button class="tab active" data-wide-filter="pending">待完成</button><button class="tab" data-wide-filter="completed">已完成</button><button class="tab" data-wide-filter="all">全部</button></div><label class="search-box"><svg class="icon"><use href="#i-search"/></svg><input id="todo-search" type="search" aria-label="搜索待办" placeholder="搜索待办"></label></div><div id="wide-todo-list" class="wide-todo-list"></div></section>
        <section id="overview-view" class="overview-view" hidden>
          <div class="overview-heading"><div><h2>所有记录</h2><span id="overview-count" class="overview-count"></span></div><button id="overview-this-week" class="secondary-button"><svg class="icon"><use href="#i-calendar"/></svg>本周周报</button></div>
          <div class="overview-toolbar"><label class="overview-year-filter"><select id="overview-year" aria-label="筛选记录年份"><option value="all">全部年份</option></select></label><label class="search-box overview-search"><svg class="icon"><use href="#i-search"/></svg><input id="overview-search" type="search" aria-label="搜索所有记录和周总结" placeholder="搜索所有记录" maxlength="100"></label></div>
          <div id="overview-list" class="overview-list" aria-live="polite"></div>
          <button id="overview-load-more" class="secondary-button overview-load-more" hidden>加载更多</button>
        </section>
      </main>
    </div>
  </div>
  <dialog id="entry-dialog" class="editor-dialog"><form id="entry-form"><div class="dialog-heading"><div><span class="section-eyebrow">WEEKLY JOURNAL</span><h2 id="entry-dialog-title">记一笔</h2></div><button type="button" class="icon-button" data-close-dialog aria-label="关闭"><svg class="icon"><use href="#i-close"/></svg></button></div><label class="field-label" for="entry-date">记录日期</label><select id="entry-date"></select><label class="field-label" for="entry-content">记录内容</label><textarea id="entry-content" required maxlength="10000" rows="6" placeholder="今天做了什么…"></textarea><div class="record-style-row"><div><label class="field-label" for="entry-color">文字颜色</label><div class="color-control"><input id="entry-color" type="color"><label class="inherit-check"><input id="entry-inherit-color" type="checkbox" checked>跟随外观</label></div></div><div><label class="field-label" for="entry-size">字号</label><select id="entry-size"><option value="">跟随外观</option value="12">12 px</option><option value="14">14 px</option><option value="15">15 px</option><option value="16">16 px</option><option value="18">18 px</option><option value="20">20 px</option><option value="24">24 px</option><option value="28">28 px</option></select></div></div><div class="dialog-footer"><button type="button" class="secondary-button" data-close-dialog>取消</button><button type="submit" class="primary-button">保存记录</button></div></form></dialog>
  <dialog id="todo-dialog" class="editor-dialog"><form id="todo-form"><div class="dialog-heading"><div><span class="section-eyebrow">TO-DO LIST</span><h2 id="todo-dialog-title">新增待办</h2></div><button type="button" class="icon-button" data-close-dialog aria-label="关闭"><svg class="icon"><use href="#i-close"/></svg></button></div><label class="field-label" for="todo-content">待办事项</label><textarea id="todo-content" required maxlength="10000" rows="3" placeholder="接下来要做的事…"></textarea><div class="deadline-heading"><label class="field-label" for="todo-due">截止时间</label><button id="clear-deadline" type="button" class="text-button">清除</button></div><input id="todo-due" type="datetime-local" step="60"><div class="record-style-row"><div><label class="field-label" for="todo-color">文字颜色</label><div class="color-control"><input id="todo-color" type="color"><label class="inherit-check"><input id="todo-inherit-color" type="checkbox" checked>跟随外观</label></div></div><div><label class="field-label" for="todo-size">字号</label><select id="todo-size"><option value="">跟随外观</option><option value="12">12 px</option><option value="14">14 px</option><option value="15">15 px</option><option value="16">16 px</option><option value="18">18 px</option><option value="20">20 px</option><option value="24">24 px</option><option value="28">28 px</option></select></div></div><div class="dialog-footer"><button type="button" class="secondary-button" data-close-dialog>取消</button><button type="submit" class="primary-button">保存待办</button></div></form></dialog>
  <dialog id="settings-dialog" class="settings-dialog">
    <div class="dialog-heading"><div><span class="section-eyebrow">MAKE IT YOURS</span><h2>外观设置</h2></div><button class="icon-button" data-close-dialog aria-label="关闭"><svg class="icon"><use href="#i-close"/></svg></button></div>
    <label class="field-label">背景</label>
    <div id="background-options" class="background-options"></div>
    <label class="upload-background" for="background-upload"><svg class="icon"><use href="#i-upload"/></svg><span id="upload-label">上传背景</span><span class="upload-formats">JPG / PNG / WEBP</span></label>
    <input id="background-upload" type="file" accept="image/jpeg,image/png,image/webp" hidden>
    <div class="settings-section">
      <span class="field-label settings-section-title">字体大小</span>
      <div class="settings-label-row"><label class="field-label" for="ui-font-size">界面文字</label><output id="ui-font-size-value" for="ui-font-size">16 px</output></div>
      <div class="font-slider"><span aria-hidden="true">A</span><input id="ui-font-size" type="range" min="12" max="24" step="1"><span aria-hidden="true">A</span></div>
      <div class="settings-label-row content-size-label"><label class="field-label" for="global-font-size">周报与待办内容</label><output id="font-size-value" for="global-font-size">15 px</output></div>
      <div class="font-slider"><span aria-hidden="true">A</span><input id="global-font-size" type="range" min="12" max="28" step="1"><span aria-hidden="true">A</span></div>
    </div>
    <div class="settings-section"><label class="field-label">文字颜色</label><div class="region-colors"><label>界面文字<input type="color" data-setting-color="textColor"></label><label>标题<input type="color" data-setting-color="headingColor"></label><label>周报内容<input type="color" data-setting-color="entryColor"></label><label>待办内容<input type="color" data-setting-color="todoColor"></label></div></div>
    <div id="appearance-preview" class="appearance-preview"><svg class="icon"><use href="#i-leaf"/></svg><div><strong>本周记录</strong><p class="preview-interface">周五 · 10月9日</p><p class="preview-entry">完成本周回顾</p><p class="preview-todo">整理下周待办</p></div><span>微软雅黑</span></div>
    <div class="dialog-footer"><button id="reset-settings" class="text-button">恢复默认</button><button id="save-settings" class="primary-button">保存外观</button></div>
  </dialog>
  <dialog id="delete-dialog" class="delete-dialog"><div class="delete-icon"><svg class="icon"><use href="#i-trash"/></svg></div><h2 id="delete-title">删除这条记录？</h2><div class="dialog-footer"><button id="cancel-delete" class="secondary-button">取消</button><button id="confirm-delete" class="danger-button">删除</button></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
